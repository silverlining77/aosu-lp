<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOSU UV BEAUTY ESSENCE | とけるように、澄んでいく。</title>
  <meta name="description" content="つけた瞬間、ひんやり。素肌を軽やかに守るUV美容液「AOSU」。SPF50+・PA++++、冷却処方、美容液成分配合。">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Sawarabi+Mincho&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== ヘッダー ==================== -->
  <header class="l-header">
    <h1 class="l-header__logo">AOSU</h1>
  </header>

  <main>

    <!-- ==================== FV ==================== -->
    <section class="p-fv">
      <!-- 背景画像（瓶・バッジ込み）：画面幅でPC用/SP用を切り替え -->
      <picture class="p-fv__bg">
        <source media="(min-width: 768px)" srcset="img/fv-bg_pc.webp">
        <img src="img/fv-bg_sp.webp" alt="AOSU UV BEAUTY ESSENCEのボトル。冷却処方・美容液配合・SPF50+ PA++++">
      </picture>

      <div class="p-fv__text">
        <p class="p-fv__catch">とけるように、澄んでいく。</p>
        <p class="p-fv__sub">つけた瞬間、ひんやり</p>
        <p class="p-fv__lead">素肌を軽やかに守るUV美容液</p>
      </div>

      <div class="p-fv__cta">
        <a href="#offer" class="c-button">無料サンプルを試す</a>
      </div>
    </section><!-- /.p-fv -->

    <!-- ==================== リード ==================== -->
    <section class="p-lead">
      <div class="l-inner">
        <p class="p-lead__text">守るだけのUVケアから、<br>ひんやり素肌に心地よく<br class="u-sp-only">馴染むUV美容液</p>
      </div>
    </section><!-- /.p-lead -->

    <!-- ==================== 3つの特徴 ==================== -->
    <section class="p-feature">
      <div class="l-inner">
        <h2 class="c-section-title">
          <span class="c-section-title__ja">3つの特徴</span>
          <span class="c-section-title__en">FEATURES</span>
        </h2>

        <div class="p-feature__item">
          <!-- 01 冷却処方 -->
        </div>
        <div class="p-feature__item">
          <!-- 02 美容液成分配合 -->
        </div>
        <div class="p-feature__item">
          <!-- 03 SPF50+・PA++++ -->
        </div>

        <a href="#offer" class="c-button">無料サンプルを試す</a>
      </div>
    </section><!-- /.p-feature -->

    <!-- ==================== お客様の声 ==================== -->
    <section class="p-voice">
      <div class="l-inner">
        <h2 class="c-section-title">
          <span class="c-section-title__ja">お客様の声</span>
          <span class="c-section-title__en">VOICES</span>
        </h2>
        <!-- 声 ×3 -->
        <p class="p-voice__note">※個人の感想であり、効果を保証するものではありません。</p>
      </div>
    </section><!-- /.p-voice -->

    <!-- ==================== 商品紹介 ==================== -->
    <section class="p-product">
      <div class="l-inner">
        <!-- ボトル画像・コピー・チェックリスト -->
      </div>
    </section><!-- /.p-product -->

    <!-- ==================== 写真の帯 ==================== -->
    <div class="p-band" aria-hidden="true"></div>

    <!-- ==================== オファー ==================== -->
    <section class="p-offer" id="offer">
      <div class="l-inner">
        <!-- 無料サンプル / 定期便 -->
      </div>
    </section><!-- /.p-offer -->

  </main>

  <!-- ==================== フッター ==================== -->
  <footer class="l-footer">
    <div class="l-inner">
      <p class="l-footer__logo">AOSU</p>
      <!-- SNS・リンク・コピーライト -->
    </div>
  </footer>

</body>
</html>
